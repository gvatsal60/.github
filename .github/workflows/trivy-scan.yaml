name: Trivy Scan
on:
  pull_request:
  push:
    branches: ["master", "main"]
  workflow_call:
    inputs:
      dockerfile_exists:
        description: "Whether the repo has a Dockerfile"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
      - name: Upload Trivy fs results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "filesystem"
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    if: ${{ inputs.dockerfile_exists }}
    needs: trivy-filesystem
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t trivy-scan-image .
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: "image"
          image-ref: "trivy-scan-image:latest"
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          vuln-type: "os,library"
      - name: Upload Trivy image results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "image"
